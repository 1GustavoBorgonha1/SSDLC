# SEC-1 — análise estática e quality gate (SPEC-004 §3).
# SonarQube self-hosted na mesma EC2 do deploy (ver docs/security-gates.md);
# não usa "organization" — esse conceito é do SonarCloud.
sonar.projectKey=salafacil
sonar.projectName=SalaFacil
sonar.projectVersion=1.0.0

sonar.sources=app/src,app/public
sonar.tests=app/tests
sonar.exclusions=app/node_modules/**,app/dist/**,app/coverage/**

sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.typescript.tsconfigPath=app/tsconfig.json

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
